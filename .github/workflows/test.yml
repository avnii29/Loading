name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anuvartan
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: anuvartan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anuvartan -d anuvartan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and migrate
        working-directory: backend
        env:
          DB_USER: anuvartan
          DB_PASSWORD: ci-only-not-a-secret
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: anuvartan
          JWT_SECRET: ci-only-not-a-secret-value-32chars
          ENVIRONMENT: development
        run: |
          python -m pip install -r requirements.txt
          python -m alembic upgrade head
          python -m pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
