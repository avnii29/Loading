# Applying this blueprint creates a free Render web service and a free Postgres database.
# The free database starts empty, expires 30 days after creation, and Render then deletes it.
# Do not apply until that is accepted. The local anuvartan database is not copied.
# Free web services have no persistent disk, so uploaded photos do not survive a restart.
services:
  - type: web
    name: anuvartan-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: Anuvarthan API
      - key: FRONTEND_ORIGIN
        value: https://anuvartan-tau.vercel.app
      - key: MAP_PROVIDER
        value: osm
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anuvartan-db
          property: connectionString

databases:
  - name: anuvartan-db
    plan: free
    databaseName: anuvartan
    user: anuvartan
